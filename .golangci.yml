version: "2"
run:
  concurrency: 4
  issues-exit-code: 20
  tests: true
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - noinlineerr
    - copyloopvar
    - intrange
    - wsl
    - gomodguard
    - varnamelen
    - ireturn
  settings:
    cyclop:
      max-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 17
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    errcheck:
      check-type-assertions: true
      check-blank: true
    # exhaustive:
    #   default-signifies-exhaustive: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - err113
          - funlen
          - lll
          - wsl_v5
          - errorlint
formatters:
  enable:
    - gofmt
    - goimports
    - gci
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax